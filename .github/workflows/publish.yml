name: Publish to Cloudflare Pages and R2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: cloudflare-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ASSET_REGEX: '^[^/]+\.(ogg|mp3|m4a|png|svg)$'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          #Full history so the R2 step can diff the pushed range
          fetch-depth: 0

      #Only CDN asset types go out, never README or workflow files
      - name: Stage assets
        run: |
          mkdir _site
          git ls-files | grep -E "$ASSET_REGEX" | xargs -I{} cp {} _site/

      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy _site --project-name=guivo --branch=main --commit-dirty=true

      - name: Sync R2 bucket
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          content_type() {
            case "$1" in
              *.ogg) echo audio/ogg ;;
              *.mp3) echo audio/mpeg ;;
              *.m4a) echo audio/mp4 ;;
              *.png) echo image/png ;;
              *.svg) echo image/svg+xml ;;
            esac
          }
          #stdin from /dev/null so wrangler cannot swallow the file list of the read loop
          put() {
            npx --yes wrangler@4 r2 object put "guivo/$1" --file="$1" --remote \
              --content-type "$(content_type "$1")" --cache-control "public, max-age=31536000, immutable" < /dev/null
          }
          #Manual runs and first pushes have no usable range, so upload everything
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git ls-files | grep -E "$ASSET_REGEX" | while read -r f; do put "$f"; done
            exit 0
          fi
          git diff --no-renames --name-status "$BEFORE" "$AFTER" | while read -r status f; do
            echo "$f" | grep -qE "$ASSET_REGEX" || continue
            if [ "$status" = "D" ]; then
              npx --yes wrangler@4 r2 object delete "guivo/$f" --remote < /dev/null
            else
              put "$f"
            fi
          done
